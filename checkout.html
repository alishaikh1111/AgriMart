<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriMart - Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🌾 AgriMart
    </div>

    <nav class="navbar">

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <a href="orders.html">
            📦 Orders
        </a>

        <a href="profile.html">
            👤 Profile
        </a>

    </nav>


    <a href="cart.html" class="cart-button">

        🛒 Cart

        <span id="cart-count">
            0
        </span>

    </a>

</header>



<main class="checkout-page">


    <h1>
        💳 Checkout
    </h1>


    <div class="checkout-container">


        <!-- ================= CUSTOMER DETAILS ================= -->

        <div class="checkout-form-card">

            <h2>
                📍 Delivery Details
            </h2>


            <form id="checkoutForm">


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="checkoutName"
                    placeholder="Enter your full name"
                    required
                >


                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="checkoutPhone"
                    placeholder="Enter mobile number"
                    required
                >


                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="checkoutEmail"
                    placeholder="Enter email"
                    required
                >


                <label>
                    Address
                </label>

                <textarea
                    id="checkoutAddress"
                    placeholder="House No., Street, Area"
                    required
                ></textarea>


                <label>
                    City
                </label>

                <input
                    type="text"
                    id="checkoutCity"
                    placeholder="Enter city"
                    required
                >


                <label>
                    State
                </label>

                <input
                    type="text"
                    id="checkoutState"
                    placeholder="Enter state"
                    required
                >


                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    id="checkoutPincode"
                    placeholder="Enter pincode"
                    required
                >


                <h2 class="payment-heading">
                    💰 Payment Method
                </h2>


                <div class="payment-options">


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="Cash on Delivery"
                            checked
                        >

                        💵 Cash on Delivery

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="UPI"
                        >

                        📱 UPI Payment

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="Card"
                        >

                        💳 Debit / Credit Card

                    </label>


                </div>


                <button
                    type="submit"
                    class="place-order-button"
                >
                    ✅ Place Order
                </button>


            </form>

        </div>



        <!-- ================= ORDER SUMMARY ================= -->

        <div class="checkout-summary-card">

            <h2>
                🛒 Order Summary
            </h2>


            <div id="checkoutItems">

            </div>


            <div class="checkout-total">

                <span>
                    Total Amount
                </span>

                <strong id="checkoutTotal">
                    ₹0
                </strong>

            </div>


            <a
                href="cart.html"
                class="back-cart-button"
            >
                ← Back to Cart
            </a>

        </div>


    </div>

</main>



<footer class="footer">

    <h3>
        🌾 AgriMart
    </h3>

    <p>
        Empowering Farmers with Digital Agriculture
    </p>

    <p>
        © 2026 AgriMart. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCheckout();

    }
);


function loadCheckout() {

    const cart =
        JSON.parse(
            localStorage.getItem(
                "agrimartCart"
            )
        ) || [];


    const container =
        document.getElementById(
            "checkoutItems"
        );


    const totalElement =
        document.getElementById(
            "checkoutTotal"
        );


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="checkout-empty">

                <h3>
                    Your cart is empty
                </h3>

                <p>
                    Please add products before checkout.
                </p>

                <a
                    href="index.html#products"
                    class="hero-button"
                >
                    Shop Products
                </a>

            </div>

        `;

        totalElement.textContent = "₹0";

        return;

    }


    let total = 0;


    container.innerHTML = "";


    cart.forEach(
        function(product) {

            const itemTotal =
                Number(product.price) *
                Number(product.quantity);


            total += itemTotal;


            const item =
                document.createElement("div");


            item.className =
                "checkout-item";


            item.innerHTML = `

                <div>

                    <strong>
                        ${product.name}
                    </strong>

                    <p>
                        Quantity: ${product.quantity}
                    </p>

                </div>

                <strong>
                    ₹${itemTotal}
                </strong>

            `;


            container.appendChild(item);

        }
    );


    totalElement.textContent =
        "₹" + total;

}



document.getElementById("checkoutForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const cart = JSON.parse(localStorage.getItem("agrimartCart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    const name = document.getElementById("checkoutName").value.trim();
    const phone = document.getElementById("checkoutPhone").value.trim();
    const email = document.getElementById("checkoutEmail").value.trim();
    const address = document.getElementById("checkoutAddress").value.trim();
    const city = document.getElementById("checkoutCity").value.trim();
    const state = document.getElementById("checkoutState").value.trim();
    const pincode = document.getElementById("checkoutPincode").value.trim();

    const paymentElement = document.querySelector(
        'input[name="payment"]:checked'
    );

    if (!name || !phone || !email || !address || !city || !state || !pincode) {
        alert("Please fill all delivery details.");
        return;
    }

    if (!paymentElement) {
        alert("Please select a payment method.");
        return;
    }

    const payment = paymentElement.value;

    let total = 0;

    cart.forEach(function(product) {
        total += Number(product.price) * Number(product.quantity || 1);
    });

    const order = {
        orderId: "AM" + Date.now(),

        customer: {
            name: name,
            phone: phone,
            email: email,
            address: address,
            city: city,
            state: state,
            pincode: pincode
        },

        payment: payment,
        products: cart,
        total: total
    };

    try {

        const response = await fetch("http://127.0.0.1:5000/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(order)
        });

        const result = await response.json();

        if (result.success) {

            let orders =
                JSON.parse(localStorage.getItem("agrimartOrders")) || [];

            orders.push({
                orderId: order.orderId,
                date: new Date().toLocaleString(),
                customer: order.customer,
                payment: order.payment,
                products: order.products,
                total: order.total,
                status: "Order Placed"
            });

            localStorage.setItem(
                "agrimartOrders",
                JSON.stringify(orders)
            );

            localStorage.removeItem("agrimartCart");

            alert(
                "Order placed successfully! 🎉\n\nOrder ID: " +
                order.orderId
            );

            window.location.href = "orders.html";

        } else {

            alert(
                "Order could not be placed.\n" +
                result.message
            );
        }

    } catch (error) {

        console.error("Backend Error:", error);

        alert(
            "Backend server is not connected.\n\n" +
            "Please make sure Flask is running on port 5000."
        );
    }

});
</script>
</body>
</html>
