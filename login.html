<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriMart - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🌾 AgriMart
    </div>

    <nav class="navbar">


        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>



<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to your AgriMart account
        </p>


        <form onsubmit="loginUser(event)">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                🔐 Login
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


        <a
            href="index.html"
            class="auth-home"
        >
            ← Back to Home
        </a>

    </div>

</main>



<footer class="footer">

    <h3>🌾 AgriMart</h3>

    <p>
        Empowering Farmers with Digital Agriculture
    </p>

    <p>
        © 2026 AgriMart. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>
<script src="login.js"></script>

</body>
</html>
