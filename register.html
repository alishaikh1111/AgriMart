<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriMart - Register</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">


    <div class="logo">
        🌾 AgriMart
    </div>

    <nav class="navbar">

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>



<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🌱
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Join AgriMart today
        </p>


        <form onsubmit="registerUser(event)">


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="registerPhone"
                placeholder="Enter your phone number"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                📝 Create Account
            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="index.html"
            class="auth-home"
        >
            ← Back to Home
        </a>

    </div>

</main>



<footer class="footer">

    <h3>🌾 AgriMart</h3>

    <p>
        Empowering Farmers with Digital Agriculture
    </p>

    <p>
        © 2026 AgriMart. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>

<script src="register.js"></script>

</body>
</html>
